[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[project]
name = "uk-postcode-api"
version = "1.0.0"
description = "FastAPI backend for UK Postcode lookup service"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]==0.118.0",
    "uvicorn==0.37.0",
    "pydantic==2.11.10",
    "pydantic-settings==2.11.0",
    "logfire[fastapi]==4.11.0",
    "sentry-sdk==2.39.0",
    "python-dotenv==1.1.1",
    "gunicorn==23.0.0",
    "msgpack==1.1.0",
]

[dependency-groups]
dev = [
    "ruff==0.13.3",
    "pytest==8.4.2",
    "pytest-asyncio==1.2.0",
    "pytest-env==1.1.5",
    "httpx==0.28.1",
    "coverage==7.10.7",
    "pytest-cov==7.0.0",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
extend-select = ["I"]
ignore = ['E402']

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.coverage.run]
omit = [
    "tests/*",
    "scripts/*",
]

[tool.coverage.report]
precision = 2
exclude_lines = [
    'pragma: no cover',
    'def __repr__',
    'def __str__',
    'raise NotImplementedError',
    'raise NotImplemented',
    'print',
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--tb=native"
env = [
    "AUTH_TOKEN=testing",
]
filterwarnings = [
    'error',
    "ignore::pytest.PytestUnraisableExceptionWarning",
]

